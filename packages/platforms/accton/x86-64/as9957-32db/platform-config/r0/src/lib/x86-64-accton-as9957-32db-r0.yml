---

######################################################################
#
# platform-config for AS9957
#
######################################################################

x86-64-accton-as9957-32db-r0:

  grub:

    serial: >-
      --port=0x3f8
      --speed=115200
      --word=8
      --parity=no
      --stop=1

    kernel:
      <<: *kernel-5-4

    args: >-
      console=ttyS0,115200n8
      intel_iommu=pt
      pcie_aspm=off
      modprobe.blacklist=i2c-ismt,i2c_ismt,i40e

  ##network:
