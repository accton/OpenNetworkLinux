# Keep the RAID boot hooks local to this platform.
prerequisites:
  packages:
    - onl-vendor-config-accton:all
    - onl-platform-modules-x86-64-accton-as9957-32db:amd64

common:
  version: 1.0.0
  arch: amd64
  copyright: Copyright 2013, 2014, 2015 Big Switch Networks
  maintainer: support@bigswitch.com
  support: opennetworklinux@googlegroups.com
  changelog: None
  dists: $DISTS

packages:
  - name: onl-platform-config-x86-64-accton-as9957-32db-r0
    depends: onl-vendor-config-accton,onl-platform-modules-x86-64-accton-as9957-32db
    summary: ONL Platform Configuration Package for x86-64-accton-as9957-32db-r0
    # Copy the platform tree before placing the boot entry inside it.
    files:
      - src/lib: /lib/platform-config/x86-64-accton-as9957-32db-r0/onl
      - src/python: ${PY_INSTALL}/onl/platform/
      - src/boot/mdraid: /lib/platform-config/x86-64-accton-as9957-32db-r0/onl/boot/x86-64-accton-as9957-32db-r0
      - src/boot.d/05.mdraid: /etc/boot.d/05.mdraid
      - src/init.d/onl-mdraid-clean: /etc/init.d/onl-mdraid-clean
    # Register the shutdown script when the package is configured.
    after-install: $__DIR__/src/init.d/postinst

  - name: onl-platform-build-x86-64-accton-as9957-32db-r0
    summary: ONL Platform Build Package for x86-64-accton-as9957-32db-r0
    optional-files:
      builds: $$PKG_INSTALL
